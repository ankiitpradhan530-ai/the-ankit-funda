  research:null,  // e.g. async (topic)=>sources[] -> verified web research API

async function callAI(p){
  let response;
  try {
    response = await fetch('/.netlify/functions/generate', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({prompt:p})
    });
  } catch (err) {
    throw new Error('Could not contact the Netlify AI backend. Check your internet connection and confirm this site was deployed with the Netlify Function.');
  }

  const raw = await response.text();
  let data = {};
  try { data = raw ? JSON.parse(raw) : {}; } catch (_) {}

  if (!response.ok) {
    if (response.status === 404) {
      throw new Error('Netlify AI Function not found (404). Deploy the complete project using GitHub; a Netlify Drop static upload does not publish this function.');
    }
    if (response.status === 503) {
      throw new Error(data.error || 'GEMINI_API_KEY is missing from this Netlify project. Add it under Project configuration → Environment variables, enable Functions scope, then redeploy.');
    }
    throw new Error(data.error || `AI backend error (${response.status}). Check Netlify Function logs and your Gemini API quota/key.`);
  }
  if (!data.text) throw new Error('The AI backend responded, but returned no script. Try again with a shorter topic.');
  return data.text;
}

const SECS=['Opening Hook','Introduction','Background','Main Investigation','Facts and Evidence','Real Examples','Analysis','Emotional Connection','Conclusion'];
function demoScript(){

  const B={
  'Opening Hook':[`What if the biggest story about ${T} is the one nobody around you is talking about?`,`Stay with me for ${S.dur} minutes, because we are about to follow the evidence.`],
  'Introduction':[`Today on THE ANKIT FUNDA, we investigate ${T}.`,`We will separate confirmed facts from rumours, and I will tell you which is which. [VERIFY: add scope of the investigation]`],
  'Background':[`To understand ${T}, we first go back to how it began. [VERIFY: add dated, sourced history]`,`Here is the context most people skip.`],
  'Main Investigation':[`Now the real question: what is actually happening with ${T}?`,`Let us look at what official records and reports say. [VERIFY: cite report name + year]`],
  'Facts and Evidence':[`Here are the numbers. [VERIFY: add statistic + source link]`,`Notice what the data says, and what it does not say.`],
  'Real Examples':[`Let us step out of the numbers and into real life. [VERIFY: add a real, documented example]`,`This is where it becomes personal.`],

  'Conclusion':[`So, what did we learn about ${T}?`,`Now you know the facts, so what will you do with them? Thank you for watching THE ANKIT FUNDA.`]};
  return (L?L+'\n\n':'')+SECS.map(s=>`## ${s}\n${B[s].join(' ')}`).join('\n\n');
}

const SHOTS=[['Aerial establishing shot','Drone, slow descend','Golden-hour sunlight','Wide outdoor location'],['Extreme close-up detail','Handheld, slight push-in','Soft natural window light','Tight texture / detail'],['Medium shot of people at work','Gimbal tracking','Overcast diffused light','Real working environment'],['Wide environmental shot','Slow pan left to right','Late-afternoon haze','Open landscape / street'],['Over-the-shoulder shot','Static tripod','Practical lights, low-key','Interior, documentary style']];

const TRANS=['Hard cut','Cross dissolve (0.5s)','Dip to black (0.4s)','Match cut on movement','Quick push-zoom'];
const WEATHER=['clear sky','light haze','overcast','soft golden sunset','light morning mist'];
const LENS=['35mm documentary lens','24mm wide lens','85mm shallow depth of field','50mm natural perspective','drone 24mm'];
function split(script,topic){
  const out=[];let sec='';
  script.split(/\n+/).forEach(line=>{
    line=line.trim();if(!line)return;
    if(/^#+\s*/.test(line)){sec=line.replace(/^#+\s*/,'');return}
    line.split(/(?<=[.!?।])\s+/).forEach(t=>{
      t=t.trim();if(t.length<3)return;
      const i=out.length,k=SHOTS[i%SHOTS.length],w=t.replace(/\[VERIFY[^\]]*\]/g,'').trim().split(/\s+/).length;
      out.push({n:i+1,sec,text:t,dur:Math.max(4,Math.round(w*0.45)),vis:`${k[0]} illustrating: "${t.replace(/\[VERIFY[^\]]*\]/g,'').trim().slice(0,70)}"`,kw:topic||'',cam:k[0],mov:k[1],light:k[2],env:k[3],
        broll:['Establishing wide of location','Hands / detail close-up','Reaction or crowd cutaway'].join('; '),ost:t.length<60?t:'',sfx:SFX[i%5],music:MUSIC[i%5],trans:TRANS[(i+1)%5],ftype:'Stock',done:false});
    });
  });
  return out;
}

 <button class="btn" style="margin-top:10px" data-a="addFact">Add to ledger</button>
 ${S.facts.map((f,i)=>`<div class="card" style="margin:10px 0 0"><span class="tag ${f.t==='Confirmed fact'?'ok':'warn'}">${f.t}</span><div>${E(f.c)}</div><div class="muted">Source: ${E(f.s)||'⚠ none — do not use'}</div><button class="btn g s" data-a="delFact" data-v="${i}">Remove</button></div>`).join('')}</div>`},
visual(){return need()||`<div class="card"><h2>Script to Visual Director</h2><p class="muted">${S.scenes.length} scenes · ${prog()}% done · Fields are editable. Auto-suggestions are rule-based; refine them or connect an AI API.</p><div class="bar"><i style="width:${prog()}%"></i></div><div class="row" style="margin-top:10px"><button class="btn g" data-a="exp" data-v="plan">Export visual plan</button></div></div>`+S.scenes.map((s,i)=>`<div class="card sc ${s.done?'done':''}"><h3>Scene ${String(s.n).padStart(2,'0')} · ${s.dur}s <span class="muted" style="text-transform:none">${E(s.sec)}</span></h3><p>“${E(s.text)}”</p>
 <div class="kv"><span>Visual</span><span>${E(s.vis)}</span><span>Real footage</span><span>${E(s.ftype)} — search “${E(s.kw)}”</span><span>Camera</span><span>${E(s.cam)}</span><span>Movement</span><span>${E(s.mov)}</span><span>Lighting</span><span>${E(s.light)}</span><span>Background</span><span>${E(s.env)}</span><span>B-roll</span><span>${E(s.broll)}</span><span>On-screen</span><span>${E(s.ost)||'—'}</span><span>SFX</span><span>${E(s.sfx)}</span><span>Music</span><span>${E(s.music)}</span><span>Transition</span><span>${E(s.trans)}</span></div>
 ${fld(i,'vis','Edit visual description',s.vis)}${fld(i,'ost','Edit on-screen text',s.ost)}
 <div class="row" style="margin-top:10px"><button class="btn g s" data-a="copyScene" data-v="${i}">Copy scene</button><button class="btn s" data-a="done" data-v="${i}">${s.done?'✓ Done (undo)':'Mark done'}</button></div></div>`).join('')},
footage(){return need()||`<div class="card"><h2>Real Footage Finder</h2><div class="banner">Thumbnails are not loaded (no media API connected) — use the search links. Always read each clip’s license and attribution terms. Pexels/Pixabay licenses differ from Wikimedia/Archive items; some Archive items are copyrighted. News channel and YouTube clips are NOT free to reuse.</div>
 <span class="tag">Actual documentary footage</span><span class="tag">Stock footage</span><span class="tag">AI-generated</span><span class="tag">Illustrative recreation</span></div>`+S.scenes.map((s,i)=>`<div class="card sc"><h3>Scene ${s.n}</h3><p class="muted">“${E(s.text.slice(0,90))}”</p>${fld(i,'kw','Search keywords (English works best)',s.kw)}<label>Footage type (label honestly)</label><select data-i="${i}" data-f="ftype">${['Actual documentary footage','Stock','AI-generated','Illustrative recreation'].map(o=>`<option ${o===s.ftype?'selected':''}>${o}</option>`).join('')}</select>${s.ftype==='AI-generated'?'<p><span class="tag warn">Must be labelled AI-generated on screen / in description</span></p>':''}<div class="row" style="margin-top:8px">${links(s.kw).map(l=>`<a class="btn g s" style="text-decoration:none;text-align:center" href="${l[1]}" target="_blank" rel="noopener">${l[0]} ↗</a>`).join('')}</div></div>`).join('')},
prompt(){return need()||`<div class="card"><h2>AI Cinematic Video Prompts</h2><div class="banner">Video generation is not connected (<code>INTEGRATIONS.video</code>). Copy prompts into your preferred AI video tool. Output is AI-generated — never present it as real footage.</div><button class="btn g" data-a="exp" data-v="prompts">Export all prompts</button></div>`+S.scenes.map((s,i)=>`<div class="card sc"><h3>Scene ${s.n} · ${s.dur}s</h3><pre>${E(buildPrompt(s,i))}</pre><button class="btn s" data-a="copyPrompt" data-v="${i}">Copy prompt</button></div>`).join('')},
edit(){return need()||`<div class="card"><h2>Mobile Editing Studio</h2><p class="muted">Step-by-step in Odia + Hindi. Menu names can change between app versions.</p><label>Editing app</label>${sel('app',Object.keys(APPS),S.app)}<pre>${E(TIMELINE)}</pre></div>`+S.scenes.map((s,i)=>`<div class="card sc ${s.done?'done':''}"><h3>Scene ${s.n} · ${s.dur}s</h3><p class="muted">“${E(s.text.slice(0,80))}”</p>${steps(s,S.app).map((t,k)=>`<div class="step"><b>${k+1}.</b><div><b style="color:var(--tx)">${t[0]}</b><br>${E(t[1])}</div></div>`).join('')}<button class="btn s" data-a="done" data-v="${i}">${s.done?'✓ Done (undo)':'Mark scene edited'}</button></div>`).join('')},
lib(){return `<div class="card"><h2>Project Library</h2><p class="muted">Saved in this browser (localStorage). ${S.id?'Current project is auto-saved.':'Press “Save project” in Script to start.'}</p><div class="row"><button class="btn" data-a="new">New project</button><button class="btn g" data-a="save">Save current</button></div></div>`+(lib.length?lib.map(p=>{const d=p.scenes.filter(s=>s.done).length,pc=p.scenes.length?Math.round(d*100/p.scenes.length):0;return `<div class="card"><h3>${E(p.title)}</h3><p class="muted">${p.scenes.length} scenes · ${d} done · ${p.scenes.length-d} pending</p><div class="bar"><i style="width:${pc}%"></i></div><div class="row" style="margin-top:10px"><button class="btn s" data-a="open" data-v="${p.id}">Open / continue</button><button class="btn g s" data-a="del" data-v="${p.id}">Delete</button></div></div>`}).join(''):'<div class="card muted">No saved projects yet.</div>')}
};

/* ---------- exports ---------- */
const sceneText=s=>`SCENE ${s.n} (${s.dur}s) [${s.sec}]\nNarration: ${s.text}\nVisual: ${s.vis}\nFootage: ${s.ftype} — "${s.kw}"\nCamera: ${s.cam} | ${s.mov}\nLighting: ${s.light}\nBackground: ${s.env}\nB-roll: ${s.broll}\nOn-screen: ${s.ost||'-'}\nSFX: ${s.sfx}\nMusic: ${s.music}\nTransition: ${s.trans}`;
const exportText=k=>k==='script'?S.script:k==='plan'?S.scenes.map(sceneText).join('\n\n'):S.scenes.map((s,i)=>`SCENE ${s.n}\n${buildPrompt(s,i)}`).join('\n\n');

/* ---------- render + events ---------- */
function syncInputs(){const g=id=>document.getElementById(id);if(g('topic'))S.topic=g('topic').value;if(g('dur'))S.dur=+g('dur').value;if(g('lang'))S.lang=g('lang').value;if(g('style'))S.style=g('style').value;if(g('script'))S.script=g('script').value}
function render(){
  document.getElementById('nav').innerHTML=TABS.map(t=>`<button class="${S.tab===t[0]?'on':''}" data-a="tab" data-v="${t[0]}"><b>${t[2]}</b>${t[1]}</button>`).join('');
  document.getElementById('app').innerHTML=V[S.tab]();
  if(S.modal!==null){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="card"><h3>Export</h3><p class="muted">Direct file downloads are blocked in published pages — copy the text and paste it into Notes / Docs.</p><textarea id="mt" style="min-height:260px" readonly>${E(S.modal)}</textarea><div class="row" style="margin-top:10px"><button class="btn" data-a="copyModal">Copy all</button><button class="btn g" data-a="close">Close</button></div></div>`;document.body.appendChild(m)}
}
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;syncInputs();
  if(a==='tab'){S.tab=v;scrollTo(0,0)}
  else if(a==='demo'){S.topic=DEMO_TOPIC;S.script=DEMO_SCRIPT;S.scenes=[]}
  else if(a==='gen'){if(S.busy)return;if(!S.topic.trim()){S.msg='Enter a topic first';toast();return}S.busy=true;render();
    try{
      const prompt=`You are the documentary scriptwriter for THE ANKIT FUNDA. Write a complete, continuous ${S.dur}-minute ${S.style} documentary script in ${S.lang} about: ${S.topic}.
Use a strong 10–30 second opening hook, clear narrative flow, smooth transitions, engaging examples, and an emotionally resonant conclusion. For Odia + Hindi, use natural spoken Odia as the main language with simple Hindi punchlines. Include A-roll narration and clearly labelled B-roll / visual suggestions. Do not invent statistics, dates, quotations, named incidents, or sources. Mark every claim that needs checking with [VERIFY] and explain what source is needed. Separate confirmed facts from analysis and opinion. Avoid filler and do not leave sections half-written. Aim for a full script suitable for the selected duration.`;
      S.script=await callAI(prompt);
      S.msg='AI script generated ✓';
    }catch(err){
      S.msg=err.message || 'AI generation failed';
    }finally{S.busy=false;}
    toast();
  }
  else if(a==='split'){if(!S.script.trim()){S.msg='Paste or generate a script first';toast();return}S.scenes=split(S.script,S.topic);S.tab='visual';auto()}
  else if(a==='copyScript')return copy(S.script);
  else if(a==='save'){save();S.msg='Project saved ✓';toast()}
  else if(a==='exp'){S.modal=exportText(v)}
  else if(a==='close'){S.modal=null;document.querySelector('.modal')?.remove()}
  else if(a==='copyModal')return copy(document.getElementById('mt').value);
  else if(a==='copyScene')return copy(sceneText(S.scenes[v]));
  else if(a==='copyPrompt')return copy(buildPrompt(S.scenes[v],+v));
  else if(a==='done'){S.scenes[v].done=!S.scenes[v].done;auto()}
  else if(a==='addFact'){const c=document.getElementById('fc').value.trim();if(!c)return;S.facts.push({c,s:document.getElementById('fs').value.trim(),t:document.getElementById('ft').value});auto()}
  else if(a==='delFact'){S.facts.splice(v,1);auto()}
  else if(a==='new'){S={...S,topic:'',script:'',scenes:[],id:null,facts:[],tab:'script'}}
  else if(a==='open'){const p=lib.find(x=>x.id==v);if(p){S={...S,...p,tab:'visual'}}}
  else if(a==='del'){lib=lib.filter(x=>x.id!=v);try{localStorage.setItem('af_lib',JSON.stringify(lib))}catch(_){}if(S.id==v)S.id=null}
  if(S.modal&&a!=='close')document.querySelector('.modal')?.remove();
  render();
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.i!==undefined){S.scenes[t.dataset.i][t.dataset.f]=t.value;auto();if(t.dataset.f==='ftype')render()}
  else if(t.id==='app'){S.app=t.value;render()}
  else if(['topic','dur','lang','style','script'].includes(t.id)){syncInputs();auto()}
});
render();
</script></body></html>
